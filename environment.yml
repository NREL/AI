name: nrel-ai
channels:
  - conda-forge
  - default
  - pytorch

dependencies:
  - python<=3.11
  - pip>=20.3
  - pip:
      - git+https://github.com/NREL/tf-melt.git
      - git+https://github.com/NREL/pt-melt.git
      - jupyter
      - torchinfo
      - matplotlib
      - scikit-learn
      - pandas
      - black
      - isort
      - flake8
      - sphinx
      - ray[data,train,tune,serve]==2.22
      - optuna
      - seaborn
      - typing_extensions
      - ptyprocess
      - ipykernel
      - pyzmq
